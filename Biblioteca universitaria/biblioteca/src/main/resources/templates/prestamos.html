<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>prestamos de la biblioteca</title>
</head>
<body>
    <h1>gestion de prestamos</h1>
    
    <form th:action="@{/prestamos/guardar}" th:object="${nuevoPrestamo}" method="post">
        <label>fecha de prestamo:</label>
        <input type="date" th:field="*{fechaPrestamo}" required>
        <label>fecha de vencimiento:</label>
        <input type="date" th:field="*{fechaVencimiento}" required>
        <label>usuario:</label>
        <select name="usuario.idUsuario" required>
            <option th:each="usu : ${usuarios}" th:value="${usu.idUsuario}" th:text="${usu.codigo + ' - ' + usu.nombre + ' ' + usu.apellidos}"></option>
        </select>
        <label>ejemplar:</label>
        <select name="ejemplar.idEjemplar" required>
            <option th:each="eje : ${ejemplares}" th:value="${eje.idEjemplar}" th:text="${eje.codigoBarras + ' - ' + eje.libro.titulo}"></option>
        </select>
        <label>bibliotecario:</label>
        <select name="bibliotecario.idBibliotecario" required>
            <option th:each="bib : ${bibliotecarios}" th:value="${bib.idBibliotecario}" th:text="${bib.nombre}"></option>
        </select>
        <button type="submit">guardar prestamo</button>
    </form>
    
    <br>

    <table border="1">
        <thead>
            <tr>
                <th>id</th>
                <th>fecha de prestamo</th>
                <th>fecha de vencimiento</th>
                <th>fecha de devolucion</th>
                <th>estado</th>
                <th>usuario</th>
                <th>ejemplar</th>
                <th>bibliotecario</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="pre : ${prestamos}">
                <td th:text="${pre.idPrestamo}"></td>
                <td th:text="${pre.fechaPrestamo}"></td>
                <td th:text="${pre.fechaVencimiento}"></td>
                <td th:text="${pre.fechaDevolucion}"></td>
                <td th:text="${pre.estado}"></td>
                <td th:text="${pre.usuario.nombre + ' ' + pre.usuario.apellidos}"></td>
                <td th:text="${pre.ejemplar.codigoBarras}"></td>
                <td th:text="${pre.bibliotecario.nombre}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
