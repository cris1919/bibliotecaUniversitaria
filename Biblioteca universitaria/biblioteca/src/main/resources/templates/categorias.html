<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>categorias de la biblioteca</title>
</head>
<body>
    <h1>gestion de categorias</h1>
    
    <form th:action="@{/categorias/guardar}" th:object="${nuevaCategoria}" method="post">
        <label>nombre de categoria:</label>
        <input type="text" th:field="*{nombre}" required>
        <button type="submit">guardar categoria</button>
    </form>
    
    <br>

    <table border="1">
        <thead>
            <tr>
                <th>id</th>
                <th>nombre</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="cat : ${categorias}">
                <td th:text="${cat.idCategoria}"></td>
                <td th:text="${cat.nombre}"></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
